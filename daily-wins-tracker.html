<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Wins Tracker</title>
<style>
  :root{
    --navy:#1e293b;
    --navy-2:#0f172a;
    --bg:#ffffff;
    --card:#f5f6f8;
    --border:#e5e7eb;
    --text:#1f2937;
    --muted:#6b7280;
    --vendor:#b45309;
    --project:#0f766e;
    --executive:#7c3aed;
    --systems:#15803d;
    --operations:#334155;
    --accent:#1e293b;
    --danger:#ef4444;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);}
  header{background:var(--navy);color:#fff;padding:28px 24px;}
  header h1{margin:0 0 4px 0;font-size:26px;}
  header p{margin:0;color:#cbd5e1;font-size:14px;}
  .wrap{max-width:900px;margin:0 auto;padding:24px;}
  .card{background:var(--card);border-radius:10px;padding:20px;margin-bottom:24px;}
  .card h2{margin:0 0 16px 0;font-size:16px;}
  .row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .field{flex:1;min-width:180px;}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
  select,input[type=date],input[type=text],textarea{
    width:100%;max-width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:#fff;
  }
  @media (max-width:480px){
    .wrap{padding:16px;}
    .card{padding:16px;}
    .row{flex-direction:column;gap:14px;}
    .field{min-width:0;width:100%;}
  }
  textarea{resize:vertical;min-height:70px;}
  button.primary{
    background:var(--navy);color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;
  }
  button.primary:hover{background:var(--navy-2);}
  button.small{
    background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--text);
  }
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .tabs button{background:none;border:none;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
  .tabs button.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
  .date-heading{font-size:13px;color:var(--muted);margin:18px 0 8px 0;font-weight:600;}
  .entry{
    background:#fff;border-left:4px solid var(--operations);border-radius:6px;padding:12px 14px;margin-bottom:10px;position:relative;
  }
  .entry.vendor{border-left-color:var(--vendor);}
  .entry.projects{border-left-color:var(--project);}
  .entry.executive{border-left-color:var(--executive);}
  .entry.systems{border-left-color:var(--systems);}
  .entry.operations{border-left-color:var(--operations);}
  .entry .cat{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .entry.vendor .cat{color:var(--vendor);}
  .entry.projects .cat{color:var(--project);}
  .entry.executive .cat{color:var(--executive);}
  .entry.systems .cat{color:var(--systems);}
  .entry.operations .cat{color:var(--operations);}
  .entry .what{margin:4px 0;font-size:14px;}
  .entry .impact{font-size:13px;color:var(--muted);font-style:italic;}
  .entry .del{position:absolute;top:10px;right:12px;background:none;border:none;color:#c7cbd1;cursor:pointer;font-size:14px;}
  .entry .del:hover{color:var(--danger);}
  .empty{color:var(--muted);font-size:14px;padding:12px 0;}
  .who-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .who-toggle button{flex:1;padding:8px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:13px;}
  .who-toggle button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .task{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .task.done{opacity:.55;}
  .task-top{display:flex;align-items:flex-start;gap:10px;}
  .task-top input[type=checkbox]{margin-top:3px;}
  .task-text{flex:1;font-size:14px;}
  .task-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .task-text.done{text-decoration:line-through;}
  .comments{margin:8px 0 4px 26px;border-left:2px solid var(--border);padding-left:10px;}
  .comment{font-size:13px;margin-bottom:6px;}
  .comment b{color:var(--navy);}
  .comment-add{display:flex;gap:6px;margin:8px 0 4px 26px;}
  .comment-add input{flex:1;padding:6px 8px;font-size:12px;border:1px solid var(--border);border-radius:5px;}
  .comment-add button{white-space:nowrap;}
  .sync-status{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .sync-status.err{color:var(--danger);}
  .badge{display:inline-block;background:var(--navy);color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;margin-left:6px;}
  .section-title{display:flex;align-items:center;justify-content:space-between;}
</style>
</head>
<body>

<header>
  <h1>Daily Wins Tracker</h1>
  <p>Track daily wins and business impact — shared with Aeron</p>
</header>

<div class="wrap">

  <div id="syncStatus" class="sync-status">Connecting…</div>

  <div class="card">
    <h2>Log a Win</h2>
    <div class="row">
      <div class="field">
        <label>Category</label>
        <select id="category">
          <option value="operations">Operations &amp; Process</option>
          <option value="vendor">Vendor Management</option>
          <option value="projects">Project Management</option>
          <option value="executive">Executive Support</option>
          <option value="systems">Systems &amp; Efficiency</option>
        </select>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="entryDate">
      </div>
    </div>
    <div class="row">
      <div class="field" style="min-width:100%">
        <label>What Happened</label>
        <textarea id="whatHappened" placeholder="e.g., Built vendor approval workflow template, established email forwarding..."></textarea>
      </div>
    </div>
    <div class="row">
      <div class="field" style="min-width:100%">
        <label>Business Impact (optional)</label>
        <input type="text" id="impact" placeholder="e.g., Saves 2 hours weekly, reduces errors by 80%">
      </div>
    </div>
    <button class="primary" id="addWinBtn">+ Add Win</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-view="daily">Daily</button>
    <button class="tab-btn" data-view="weekly">Weekly</button>
    <button class="tab-btn" data-view="monthly">Monthly</button>
    <button class="tab-btn" data-view="case">Case</button>
  </div>

  <div class="card">
    <h2>All Entries</h2>
    <div id="entriesView"></div>
  </div>

  <div class="card">
    <div class="section-title">
      <h2>Tasks &amp; Notes <span style="font-weight:400;color:var(--muted)">— Aeron ↔ Michelle</span></h2>
    </div>
    <div class="who-toggle">
      <button id="whoMichelle" class="active">I'm Michelle</button>
      <button id="whoAeron">I'm Aeron</button>
    </div>
    <div class="row">
      <div class="field" style="min-width:100%">
        <label>Add a task or note</label>
        <input type="text" id="taskInput" placeholder="e.g., Please follow up with Fox 45 by Friday">
      </div>
    </div>
    <button class="primary" id="addTaskBtn">+ Add Task/Note</button>
    <div id="tasksView" style="margin-top:18px;"></div>
  </div>

</div>

<script type="module">
  // ---- FIREBASE CONFIG ----
  // Paste the config object from your Firebase project's web app settings here.
  // Until this is filled in with real values, the page runs in local-only mode
  // (same as before — data stays in this browser only).
  const firebaseConfig = {
    apiKey: "AIzaSyCB52beUZZHncyfXMRHfmmuuBEd_dcT2zA",
    authDomain: "punchoutpros-2db07.firebaseapp.com",
    projectId: "punchoutpros-2db07",
    storageBucket: "punchoutpros-2db07.firebasestorage.app",
    messagingSenderId: "968851513356",
    appId: "1:968851513356:web:075f8de87681e8f076ce29"
  };

  const statusEl = document.getElementById('syncStatus');
  let db, winsCol, tasksCol;
  let live = false;
  let fb = null; // holds the dynamically-imported firestore functions when live

  async function tryConnectFirebase() {
    if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'PASTE_ME') {
      statusEl.textContent = "Firebase isn't configured yet — running in local-only mode (data stays in this browser). See setup instructions from Claude.";
      statusEl.classList.add('err');
      return false;
    }
    try {
      const [{ initializeApp }, firestoreMod] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
      ]);
      fb = firestoreMod;
      const app = initializeApp(firebaseConfig);
      db = fb.getFirestore(app);
      winsCol = fb.collection(db, "wins");
      tasksCol = fb.collection(db, "tasks");
      // sanity check the connection actually works before trusting it
      await fb.getDocs(winsCol);
      return true;
    } catch (e) {
      console.error('Firebase connection failed:', e);
      statusEl.textContent = "Couldn't connect to the shared tracker (" + (e && e.message ? e.message : 'unknown error') + ") — running in local-only mode.";
      statusEl.classList.add('err');
      return false;
    }
  }

  const CATEGORY_LABELS = {
    operations: "Operations & Process",
    vendor: "Vendor Management",
    projects: "Project Management",
    executive: "Executive Support",
    systems: "Systems & Efficiency"
  };

  // ---------- LOCAL FALLBACK (used only if Firebase isn't configured, or as a one-time migration source) ----------
  function getLocalWins() {
    try { return JSON.parse(localStorage.getItem('winsTrackerData') || '[]'); }
    catch { return []; }
  }

  let winsCache = [];
  let tasksCache = [];
  let currentView = 'daily';
  let currentWho = 'Michelle';

  async function migrateLocalIfNeeded() {
    if (!live) return;
    const already = localStorage.getItem('winsTrackerMigrated');
    if (already) return;
    const local = getLocalWins();
    if (local.length === 0) { localStorage.setItem('winsTrackerMigrated', '1'); return; }
    const existing = await fb.getDocs(winsCol);
    if (!existing.empty) { localStorage.setItem('winsTrackerMigrated', '1'); return; }
    statusEl.textContent = `Migrating ${local.length} existing entries to the shared tracker…`;
    for (const w of local) {
      await fb.addDoc(winsCol, {
        category: w.category || 'operations',
        date: w.date || new Date().toISOString().slice(0,10),
        whatHappened: w.whatHappened || w.text || '',
        impact: w.impact || '',
        createdAt: fb.serverTimestamp()
      });
    }
    localStorage.setItem('winsTrackerMigrated', '1');
  }

  function fmtDateHeading(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  }

  function renderEntries() {
    const el = document.getElementById('entriesView');
    if (winsCache.length === 0) { el.innerHTML = '<div class="empty">No entries yet.</div>'; return; }

    const sorted = [...winsCache].sort((a,b)=> b.date.localeCompare(a.date));

    if (currentView === 'daily') {
      let html = '';
      let lastDate = null;
      for (const w of sorted) {
        if (w.date !== lastDate) {
          html += `<div class="date-heading">${fmtDateHeading(w.date)}</div>`;
          lastDate = w.date;
        }
        html += entryHtml(w);
      }
      el.innerHTML = html;
    } else if (currentView === 'weekly' || currentView === 'monthly') {
      const groups = {};
      for (const w of sorted) {
        const d = new Date(w.date + 'T00:00:00');
        let key;
        if (currentView === 'monthly') {
          key = d.toLocaleDateString('en-US', { month:'long', year:'numeric' });
        } else {
          const weekStart = new Date(d);
          weekStart.setDate(d.getDate() - d.getDay());
          key = 'Week of ' + weekStart.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
        }
        (groups[key] = groups[key] || []).push(w);
      }
      let html = '';
      for (const key of Object.keys(groups)) {
        html += `<div class="date-heading">${key} <span class="badge">${groups[key].length}</span></div>`;
        for (const w of groups[key]) html += entryHtml(w);
      }
      el.innerHTML = html;
    } else if (currentView === 'case') {
      // Case: a narrative summary grouped by category
      const byCat = {};
      for (const w of sorted) (byCat[w.category] = byCat[w.category] || []).push(w);
      let html = '';
      for (const cat of Object.keys(byCat)) {
        html += `<div class="date-heading">${CATEGORY_LABELS[cat] || cat} <span class="badge">${byCat[cat].length}</span></div>`;
        for (const w of byCat[cat]) html += entryHtml(w, true);
      }
      el.innerHTML = html;
    }
  }

  function entryHtml(w, showDate=false) {
    return `
      <div class="entry ${w.category}">
        <button class="del" data-id="${w.id}" title="Delete">✕</button>
        <div class="cat">${CATEGORY_LABELS[w.category] || w.category}</div>
        <div class="what">${escapeHtml(w.whatHappened)}${showDate ? ' <span class="task-meta">('+w.date+')</span>' : ''}</div>
        ${w.impact ? `<div class="impact">Impact: ${escapeHtml(w.impact)}</div>` : ''}
      </div>`;
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let editingTaskIds = new Set();

  function renderTasks() {
    const el = document.getElementById('tasksView');
    if (tasksCache.length === 0) { el.innerHTML = '<div class="empty">No tasks or notes yet.</div>'; return; }
    const sorted = [...tasksCache].sort((a,b)=> (b.createdAtMs||0) - (a.createdAtMs||0));
    let html = '';
    for (const t of sorted) {
      const isEditing = editingTaskIds.has(t.id);
      html += `
        <div class="task ${t.status === 'done' ? 'done' : ''}">
          <div class="task-top">
            <input type="checkbox" data-id="${t.id}" class="task-check" ${t.status === 'done' ? 'checked' : ''}>
            <div style="flex:1">
              ${isEditing
                ? `<input type="text" class="task-edit-input" data-id="${t.id}" value="${escapeHtml(t.text)}">`
                : `<div class="task-text ${t.status === 'done' ? 'done' : ''}">${escapeHtml(t.text)}</div>`}
              <div class="task-meta">added by ${escapeHtml(t.author || 'someone')}</div>
            </div>
            ${isEditing
              ? `<button class="small save-task" data-id="${t.id}">Save</button>
                 <button class="small cancel-edit-task" data-id="${t.id}">Cancel</button>`
              : `<button class="small edit-task" data-id="${t.id}">Edit</button>
                 <button class="small del-task" data-id="${t.id}">✕</button>`}
          </div>
          <div class="comments">
            ${(t.comments || []).map(c => `<div class="comment"><b>${escapeHtml(c.author)}:</b> ${escapeHtml(c.text)}</div>`).join('')}
          </div>
          <div class="comment-add">
            <input type="text" placeholder="Add a comment…" class="comment-input" data-id="${t.id}">
            <button class="small comment-btn" data-id="${t.id}">Reply</button>
          </div>
        </div>`;
    }
    el.innerHTML = html;

    el.querySelectorAll('.task-check').forEach(cb => {
      cb.addEventListener('change', async (e) => {
        const id = e.target.dataset.id;
        if (!live) return;
        await fb.updateDoc(fb.doc(db, 'tasks', id), { status: e.target.checked ? 'done' : 'open' });
      });
    });
    el.querySelectorAll('.del-task').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        if (!live) return;
        await fb.deleteDoc(fb.doc(db, 'tasks', id));
      });
    });
    el.querySelectorAll('.edit-task').forEach(btn => {
      btn.addEventListener('click', (e) => {
        editingTaskIds.add(e.target.dataset.id);
        renderTasks();
      });
    });
    el.querySelectorAll('.cancel-edit-task').forEach(btn => {
      btn.addEventListener('click', (e) => {
        editingTaskIds.delete(e.target.dataset.id);
        renderTasks();
      });
    });
    el.querySelectorAll('.save-task').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        const input = el.querySelector(`.task-edit-input[data-id="${id}"]`);
        const newText = input.value.trim();
        if (!newText) return;
        if (!live) return; // local mode handled by delegated listener below
        await fb.updateDoc(fb.doc(db, 'tasks', id), { text: newText });
        editingTaskIds.delete(id);
      });
    });
    el.querySelectorAll('.task-edit-input').forEach(inp => {
      inp.addEventListener('keydown', (e) => {
        const id = e.target.dataset.id;
        if (e.key === 'Enter') {
          e.preventDefault();
          el.querySelector(`.save-task[data-id="${id}"]`)?.click();
        } else if (e.key === 'Escape') {
          el.querySelector(`.cancel-edit-task[data-id="${id}"]`)?.click();
        }
      });
    });
    el.querySelectorAll('.comment-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        const input = el.querySelector(`.comment-input[data-id="${id}"]`);
        const text = input.value.trim();
        if (!text || !live) return;
        await fb.updateDoc(fb.doc(db, 'tasks', id), {
          comments: fb.arrayUnion({ author: currentWho, text, createdAt: new Date().toISOString() })
        });
        input.value = '';
      });
    });
  }

  // ---- wire up form ----
  document.getElementById('entryDate').valueAsDate = new Date();

  document.getElementById('addWinBtn').addEventListener('click', async () => {
    const category = document.getElementById('category').value;
    const date = document.getElementById('entryDate').value;
    const whatHappened = document.getElementById('whatHappened').value.trim();
    const impact = document.getElementById('impact').value.trim();
    if (!whatHappened) { alert('Please describe what happened.'); return; }

    if (live) {
      await fb.addDoc(winsCol, { category, date, whatHappened, impact, createdAt: fb.serverTimestamp() });
    } else {
      const local = getLocalWins();
      local.push({ id: Date.now().toString(), category, date, whatHappened, impact });
      localStorage.setItem('winsTrackerData', JSON.stringify(local));
      winsCache = local;
      renderEntries();
    }
    document.getElementById('whatHappened').value = '';
    document.getElementById('impact').value = '';
    document.getElementById('category').value = 'operations';
    document.getElementById('entryDate').valueAsDate = new Date();
  });

  document.getElementById('entriesView').addEventListener('click', async (e) => {
    if (e.target.classList.contains('del')) {
      const id = e.target.dataset.id;
      if (live) {
        await fb.deleteDoc(fb.doc(db, 'wins', id));
      } else {
        const local = getLocalWins().filter(w => w.id !== id);
        localStorage.setItem('winsTrackerData', JSON.stringify(local));
        winsCache = local;
        renderEntries();
      }
    }
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      renderEntries();
    });
  });

  document.getElementById('whoMichelle').addEventListener('click', () => {
    currentWho = 'Michelle';
    document.getElementById('whoMichelle').classList.add('active');
    document.getElementById('whoAeron').classList.remove('active');
  });
  document.getElementById('whoAeron').addEventListener('click', () => {
    currentWho = 'Aeron';
    document.getElementById('whoAeron').classList.add('active');
    document.getElementById('whoMichelle').classList.remove('active');
  });

  function getLocalTasks() {
    try { return JSON.parse(localStorage.getItem('winsTrackerTasks') || '[]'); }
    catch { return []; }
  }
  function saveLocalTasks() {
    localStorage.setItem('winsTrackerTasks', JSON.stringify(tasksCache));
  }

  document.getElementById('addTaskBtn').addEventListener('click', async () => {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    if (live) {
      await fb.addDoc(tasksCol, { text, author: currentWho, status: 'open', comments: [], createdAt: fb.serverTimestamp() });
    } else {
      tasksCache.push({ id: Date.now().toString(), text, author: currentWho, status: 'open', comments: [], createdAtMs: Date.now() });
      saveLocalTasks();
      renderTasks();
    }
    input.value = '';
  });

  // local-mode task interactions (checkbox / delete / comment) — delegated once, guarded by !live
  document.getElementById('tasksView').addEventListener('click', (e) => {
    if (live) return; // live mode handled by listeners attached in renderTasks()
    if (e.target.classList.contains('del-task')) {
      tasksCache = tasksCache.filter(t => t.id !== e.target.dataset.id);
      saveLocalTasks(); renderTasks();
    } else if (e.target.classList.contains('comment-btn')) {
      const id = e.target.dataset.id;
      const input = document.querySelector(`.comment-input[data-id="${id}"]`);
      const text = input.value.trim();
      if (!text) return;
      const t = tasksCache.find(t => t.id === id);
      if (t) { t.comments = t.comments || []; t.comments.push({ author: currentWho, text }); saveLocalTasks(); renderTasks(); }
    } else if (e.target.classList.contains('save-task')) {
      const id = e.target.dataset.id;
      const input = document.querySelector(`.task-edit-input[data-id="${id}"]`);
      const newText = input.value.trim();
      if (!newText) return;
      const t = tasksCache.find(t => t.id === id);
      if (t) { t.text = newText; saveLocalTasks(); }
      editingTaskIds.delete(id);
      renderTasks();
    }
  });
  document.getElementById('tasksView').addEventListener('change', (e) => {
    if (live) return;
    if (e.target.classList.contains('task-check')) {
      const t = tasksCache.find(t => t.id === e.target.dataset.id);
      if (t) { t.status = e.target.checked ? 'done' : 'open'; saveLocalTasks(); renderTasks(); }
    }
  });

  // ---- startup ----
  async function start() {
    live = await tryConnectFirebase();

    if (live) {
      await migrateLocalIfNeeded();
      statusEl.textContent = 'Connected — synced live with Aeron.';
      statusEl.classList.remove('err');

      fb.onSnapshot(fb.query(winsCol, fb.orderBy('date', 'desc')), snap => {
        winsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderEntries();
      }, err => {
        statusEl.textContent = 'Connection error: ' + err.message;
        statusEl.classList.add('err');
      });

      fb.onSnapshot(tasksCol, snap => {
        tasksCache = snap.docs.map(d => {
          const data = d.data();
          return { id: d.id, ...data, createdAtMs: data.createdAt?.toMillis ? data.createdAt.toMillis() : 0 };
        });
        renderTasks();
      });
    } else {
      winsCache = getLocalWins();
      tasksCache = getLocalTasks();
      renderEntries();
      renderTasks();
    }
  }

  start();
</script>
</body>
</html>
